services:
  - type: web
    name: prime-song-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MUSIC_API_URL
        sync: false
      - key: MUSIC_API_KEY
        sync: false
